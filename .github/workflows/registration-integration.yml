name: Alumni registration integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumni-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registration:
    runs-on: ubuntu-latest
    # The pinned Core requires Ruby 3.4; the release tag now supplies Ruby 4.
    container: discourse/discourse_test@sha256:94eca5318fed6171264b95204914de76a113c305cebb72d9fa9527e2c4496494
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: discourse
    env:
      RAILS_ENV: test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: "1"
      PARALLEL_TEST_PROCESSORS: "1"
      QUNIT_PARALLEL: "1"
      QUNIT_REUSE_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=2048
      CHEAP_SOURCE_MAPS: "1"
      EMBER_ENV: development
      CAPYBARA_DEFAULT_MAX_WAIT_TIME: "20"
      PLAYWRIGHT_BROWSERS_PATH: /home/discourse/.cache/ms-playwright
      DBUS_SESSION_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ISBF-Lab/ISBFweb
          ref: 211f043f51681951bbb6d562ca9df66ea73366c6
          ssh-key: ${{ secrets.ISBFWEB_CI_READ_KEY }}
          path: discourse
          persist-credentials: false
      - name: Check out the alumni identity theme
        uses: actions/checkout@v4
        with:
          repository: ISBF-Lab/ISBF-UI
          ref: cf268ca9071700e9955f56ebd09f786f7c9d0c99
          path: identity-theme
          persist-credentials: false
      - name: Prepare the native theme system tests
        run: |
          mkdir -p tmp/themes
          cp -a ../identity-theme tmp/themes/isbf-campus
      - name: Prepare native Discourse and the plugin
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/discourse"
          cp -a ../plugin plugins/isbf-alumni
          redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE discourse LOGIN SUPERUSER PASSWORD 'discourse';"
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without ""
          bundle install --jobs 1
          pnpm install --frozen-lockfile
      - name: Migrate test data and verify native HEIC decoding
        id: database
        run: |
          bin/rake db:create db:migrate
          identify -list format | grep -E 'HEIC.*[r][w-]'
      - name: Profiles, proof processing, registration and delegated permissions
        run: |
          mkdir -p tmp
          bin/rspec plugins/isbf-alumni/spec plugins/discourse-academy-roles/spec/lib/alumni_* plugins/discourse-academy-roles/spec/requests/alumni_* | tee tmp/alumni-registration-rspec.log
      - name: Build native registration frontend with both real plugins
        id: native_assets
        if: always() && steps.database.outcome == 'success'
        run: |
          pnpm playwright-install
          script/assemble_ember_build.rb
          mkdir -p "$HOME/.pki/nssdb" "$HOME/.local/share/pki/nssdb"
          dbus-daemon --system --fork 2>/dev/null || true
          isbf_bus_address=$(dbus-daemon --session --fork --print-address 2>/dev/null)
          echo "DBUS_SESSION_BUS_ADDRESS=$isbf_bus_address" >> "$GITHUB_ENV"
      - name: Native alumni invitation and email verification UI
        if: always() && steps.native_assets.outcome == 'success'
        run: |
          bin/qunit --standalone --target isbf-alumni --filter '/Alumni invitation password|Alumni registration/i' | tee tmp/alumni-password-qunit.log
      - name: Native alumni identity labels across real theme pages
        if: always() && steps.native_assets.outcome == 'success'
        run: |
          bin/rspec tmp/themes/isbf-campus/spec/system/alumni_identity_spec.rb | tee tmp/alumni-identity-system.log
      - name: Save native alumni identity system results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alumni-identity-system-results-${{ github.run_id }}
          path: |
            discourse/tmp/alumni-identity-system.log
            discourse/tmp/isbf-alumni-identity-results/
            discourse/tmp/capybara/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alumni-registration-results-${{ github.run_id }}
          path: |
            discourse/tmp/alumni-registration-rspec.log
            discourse/tmp/alumni-password-qunit.log
            discourse/log/test.log
          if-no-files-found: warn
          retention-days: 14
