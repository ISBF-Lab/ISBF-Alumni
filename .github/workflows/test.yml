name: ISBF Alumni plugin tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: alumni-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alumni registration request contract
        run: node scripts/check-registration-ui.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: find . -name '*.rb' -not -path './.git/*' -print0 | xargs -0 -n1 ruby -c
      - run: bash -n deploy/install-plugin.sh
      - run: python3 scripts/check_geography.py
